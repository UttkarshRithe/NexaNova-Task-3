server:
  port: 8083

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://user-db:5432/user_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://discovery-service:8761/eureka/

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-minimum-32-chars-long}
  expiry: 86400000

springdoc:
  servers:
    - url: http://localhost:9900     # ✅ yeh sahi hai

logging:
  level:
    org.springframework.security: DEBUG
    com.techtraining: DEBUG