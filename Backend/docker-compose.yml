version: '3.8'

services:

  # ===== DATABASES =====
  batch-db:
    image: postgres:15
    container_name: batch-db
    environment:
      POSTGRES_DB: batch_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - batch_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d batch_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:15
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d user_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  participant-db:
    image: postgres:15
    container_name: participant-db
    environment:
      POSTGRES_DB: participant_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - participant_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d participant_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  evaluation-db:
    image: postgres:15
    container_name: evaluation-db
    environment:
      POSTGRES_DB: evaluation_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - evaluation_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d evaluation_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== INFRASTRUCTURE SERVICES =====
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    # Note: Healthcheck removed for speed, but can be added if discovery supports it
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]

  config-service:
    build: ./config-service
    container_name: config-service
    ports:
      - "8888:8888"
    depends_on:
      - discovery-service

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "9900:9900"
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - discovery-service
      - config-service

  # ===== BUSINESS SERVICES =====
  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - discovery-service
      - user-db

  batch-service:
    build: ./batch-service
    container_name: batch-service
    ports:
      - "8082:8082"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - batch-db
      - discovery-service

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8083:8083"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - user-db
      - discovery-service

  participant-service:
    build: ./participant-service
    container_name: participant-service
    ports:
      - "8084:8084"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - participant-db
      - discovery-service

  evaluation-service:
    build: ./evaluation-service
    container_name: evaluation-service
    ports:
      - "8085:8085"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - evaluation-db
      - discovery-service

  report-service:
    build: ./report-service
    container_name: report-service
    ports:
      - "8086:8086"
    depends_on:
      - discovery-service
      - evaluation-service
      - batch-service
      - participant-service
      - user-service

volumes:
  batch_data:
  user_data:
  participant_data:
  evaluation_data:
