version: '3.8'

services:

  # ===== DATABASES =====
  batch-db:
    image: postgres:15
    container_name: batch-db
    environment:
      POSTGRES_DB: batch_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - batch_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d batch_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:15
    container_name: user-db
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d user_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  participant-db:
    image: postgres:15
    container_name: participant-db
    environment:
      POSTGRES_DB: participant_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - participant_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d participant_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  evaluation-db:
    image: postgres:15
    container_name: evaluation-db
    environment:
      POSTGRES_DB: evaluation_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - evaluation_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d evaluation_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  # ===== INFRASTRUCTURE SERVICES =====
  discovery-service:
    build: ./discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    environment:
      EUREKA_HOSTNAME: discovery-service
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"

  config-service:
    build: ./config-service
    container_name: config-service
    ports:
      - "8888:8888"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      - discovery-service

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "9900:9900"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      SERVER_URL: ${SERVER_URL}
      SPRING_DATA_REDIS_HOST: redis
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      - discovery-service
      - config-service

  # ===== BUSINESS SERVICES =====

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      SERVER_URL: ${SERVER_URL}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      discovery-service:
        condition: service_started
      user-db:
        condition: service_healthy

  batch-service:
    build: ./batch-service
    container_name: batch-service
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_URL: ${SERVER_URL}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      batch-db:
        condition: service_healthy
      discovery-service:
        condition: service_started

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_URL: ${SERVER_URL}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      user-db:
        condition: service_healthy
      discovery-service:
        condition: service_started

  participant-service:
    build: ./participant-service
    container_name: participant-service
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_URL: ${SERVER_URL}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      participant-db:
        condition: service_healthy
      discovery-service:
        condition: service_started

  evaluation-service:
    build: ./evaluation-service
    container_name: evaluation-service
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_URL: ${SERVER_URL}
      RABBITMQ_HOST: rabbitmq
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      evaluation-db:
        condition: service_healthy
      discovery-service:
        condition: service_started
      rabbitmq:
        condition: service_started

  report-service:
    build: ./report-service
    container_name: report-service
    ports:
      - "8086:8086"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      SERVER_URL: ${SERVER_URL}
      RABBITMQ_HOST: rabbitmq
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    volumes:
      - shared_reports:/app/temp_reports
    depends_on:
      - discovery-service
      - evaluation-service
      - batch-service
      - participant-service
      - user-service

  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
      - "8087:8087"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_URL: ${SERVER_URL}
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    depends_on:
      - discovery-service

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SERVER_URL: ${SERVER_URL}
      RABBITMQ_HOST: rabbitmq
      EUREKA_SERVER: http://discovery-service:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms128m"
    volumes:
      - shared_reports:/app/temp_reports
    depends_on:
      - rabbitmq
      - discovery-service

volumes:
  batch_data:
  user_data:
  participant_data:
  evaluation_data:
  shared_reports:
